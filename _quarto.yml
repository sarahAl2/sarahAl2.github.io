  output-dir: _site

# Freeze computational output so GitHub Actions does NOT need R or Python.
# Run `quarto render` locally after changing any code chunk, then commit the
# _freeze/ folder. See the README for details.
execute:
  freeze: auto

website:
  title: "Sarah Alhusaynat"
  description: "Data science portfolio: reproducible analytics, pipelines, and project outcomes"
  site-url: https://sarahal2.github.io
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: capstone.qmd
        text: Capstone
      - href: projects.qmd
        text: Projects
      - href: resume.qmd
        text: Resume
      - href: about.qmd
        text: About
      - icon: github
        href: https://github.com/sarahAl2
        aria-label: GitHub
  page-footer:
    left: "© 2026 Sarah Alhusaynat"

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
