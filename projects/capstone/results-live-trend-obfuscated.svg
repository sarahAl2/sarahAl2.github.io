<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Live Trend Analytics: Trailing 90-Day vs Same Period Last Year (Obfuscated)</title>
  <desc id="desc">Obfuscated trend panels showing indexed comparisons for sales, tickets, and average basket size.</desc>

  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .h1 { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .tick { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .note { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .curr { stroke: #0d9488; stroke-width: 4; fill: none; }
      .prior { stroke: #0284c7; stroke-width: 3; fill: none; stroke-dasharray: 7 5; }
      .ly { stroke: #f59e0b; stroke-width: 3; fill: none; stroke-dasharray: 3 6; }
      .dot-curr { fill: #0d9488; }
      .dot-prior { fill: #0284c7; }
      .dot-ly { fill: #f59e0b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="620"/>

  <text class="h1" x="40" y="46">Live Trend Analytics - Trailing 90-Day vs Same Period Last Year</text>
  <text class="sub" x="40" y="74">Public-safe view: values are indexed and jittered (baseline = 100), preserving directional signal only.</text>

  <rect class="panel" x="32" y="96" width="496" height="430" rx="14"/>
  <rect class="panel" x="552" y="96" width="496" height="430" rx="14"/>
  <rect class="panel" x="1072" y="96" width="496" height="430" rx="14"/>

  <text class="label" x="56" y="126">Sales Trend (Indexed)</text>
  <text class="label" x="576" y="126">Ticket Trend (Indexed)</text>
  <text class="label" x="1096" y="126">Avg Basket Trend (Indexed)</text>

