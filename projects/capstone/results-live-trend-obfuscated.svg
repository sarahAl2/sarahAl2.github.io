  <line class="curr" x1="60" y1="560" x2="100" y2="560"/>
  <text class="note" x="108" y="565">Current trailing 90-day window (indexed)</text>
  <line class="prior" x1="540" y1="560" x2="580" y2="560"/>
  <text class="note" x="588" y="565">Prior trailing 90-day window</text>
  <line class="ly" x1="950" y1="560" x2="990" y2="560"/>
