  <polyline class="prior" points="1112,308 1160,306 1208,304 1256,302 1304,302 1352,304 1400,306 1448,308 1496,310 1536,312"/>
  <polyline class="ly" points="1112,300 1160,300 1208,298 1256,298 1304,300 1352,302 1400,304 1448,306 1496,308 1536,310"/>

