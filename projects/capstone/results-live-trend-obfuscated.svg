  <polyline class="curr" points="592,342 640,330 688,320 736,306 784,292 832,276 880,258 928,244 976,228 1016,216"/>
  <polyline class="prior" points="592,348 640,344 688,340 736,334 784,328 832,320 880,314 928,306 976,298 1016,292"/>
