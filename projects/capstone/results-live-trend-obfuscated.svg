  <polyline class="curr" points="72,334 120,324 168,318 216,302 264,292 312,278 360,252 408,238 456,220 496,208"/>
  <polyline class="prior" points="72,338 120,336 168,330 216,326 264,322 312,318 360,314 408,308 456,302 496,296"/>
  <polyline class="ly" points="72,346 120,340 168,336 216,330 264,324 312,318 360,314 408,308 456,304 496,300"/>

